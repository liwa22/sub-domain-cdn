<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STREAMVID - Player</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>

body{
margin:0;
background:#0f0f0f;
font-family:'Inter',sans-serif;
color:white;
}

.header{
display:flex;
align-items:center;
padding:12px 20px;
background:#0f0f0f;
border-bottom:1px solid #303030;
position:sticky;
top:0;
z-index:100;
}

.back-btn{
cursor:pointer;
margin-right:15px;
display:flex;
align-items:center;
text-decoration:none;
color:white;
}

.logo{
font-size:18px;
font-weight:800;
}

.container{
max-width:1000px;
margin:auto;
}

.video-section{
width:100%;
background:#000;
display:flex;
justify-content:center;
min-height:220px;
}

.player-container{
width:100%;
}

.player-container.portrait{
max-width:420px;
margin:auto;
}

.info-section{
padding:20px;
}

.video-title{
font-size:20px;
font-weight:700;
margin-bottom:8px;
line-height:1.4;
}

.video-id{
font-size:12px;
color:#777;
background:#222;
display:inline-block;
padding:2px 8px;
border-radius:4px;
}

.recommend-section{
padding:20px;
border-top:1px solid #222;
}

.recommend-title{
font-size:16px;
font-weight:600;
margin-bottom:15px;
color:orange;
}

.recommend-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.rec-card{
cursor:pointer;
background:#161616;
border-radius:8px;
overflow:hidden;
text-decoration:none;
color:white;
transition:0.3s;
}

.rec-card:hover{
background:#222;
}

.rec-thumb{
width:100%;
aspect-ratio:16/9;
background:#000;
}

.rec-thumb video{
width:100%;
height:100%;
object-fit:cover;
pointer-events:none;
}

.rec-info{
padding:10px;
}

.rec-name{
font-size:13px;
font-weight:500;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
height:34px;
}

@media (min-width:768px){
.recommend-grid{
grid-template-columns:repeat(4,1fr);
}
}

</style>
</head>

<body>

<header class="header">
<a href="javascript:history.back()" class="back-btn">
<span class="material-symbols-outlined">arrow_back</span>
</a>

<div class="logo">
STREAM<span style="color:orange;">VID</span>
</div>
</header>

<div class="container">

<div class="video-section">
<div class="player-container" id="playerWrapper">
<video id="player" playsinline controls></video>
</div>
</div>

<div class="info-section">
<div class="video-title" id="mainTitle">Memuat judul...</div>
<div class="video-id" id="mainId">ID: --</div>
</div>

<div class="recommend-section">

<div class="recommend-title">
Rekomendasi Video
</div>

<div class="recommend-grid" id="recommendGrid"></div>

</div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>

const urlParams = new URLSearchParams(window.location.search);
const videoIdFromUrl = urlParams.get("id");

const player = new Plyr('#player',{
controls:[
'play-large',
'play',
'progress',
'current-time',
'mute',
'volume',
'fullscreen'
]
});

async function loadData(){

try{

const response = await fetch(
'https://cdn.jsdelivr.net/gh/liwa22/json/Video.json'
);

let allVideos = await response.json();

if(!Array.isArray(allVideos)){
console.error("JSON bukan array");
return;
}

const currentVideo =
allVideos.find(v=>String(v.id)===String(videoIdFromUrl));

if(currentVideo){

displayMainVideo(currentVideo);

displayRecommendations(allVideos,videoIdFromUrl);

}else{

document.getElementById('mainTitle').innerText =
"Video tidak ditemukan";

}

}catch(err){

console.error(err);

document.getElementById('mainTitle').innerText =
"Gagal memuat data";

}

}

function displayMainVideo(video){

document.getElementById('mainTitle').innerText =
video.Judul;

document.getElementById('mainId').innerText =
"ID: "+video.id;

player.source={
type:'video',
sources:[
{
src:video.Url,
type:'video/mp4'
}
]
};

const videoElement=document.getElementById('player');

videoElement.onloadedmetadata=function(){

const wrapper=document.getElementById('playerWrapper');

if(this.videoWidth/this.videoHeight<1){

wrapper.classList.add('portrait');

}else{

wrapper.classList.remove('portrait');

}

};

}

function displayRecommendations(data,currentId){

const grid=document.getElementById('recommendGrid');

grid.innerHTML="";

const otherVideos =
data.filter(v=>String(v.id)!==String(currentId));

if(otherVideos.length===0){

grid.innerHTML =
"<p style='opacity:.6'>Tidak ada rekomendasi</p>";

return;

}

const shuffled =
otherVideos.sort(()=>0.5-Math.random());

const selected =
shuffled.slice(0,8);

selected.forEach(v=>{

const card=document.createElement('a');

card.className="rec-card";

card.href=`detail.html?id=${v.id}`;

card.innerHTML=`
<div class="rec-thumb">
<video preload="metadata" muted playsinline>
<source src="${v.Url}#t=1" type="video/mp4">
</video>
</div>
<div class="rec-info">
<div class="rec-name">${v.Judul}</div>
</div>
`;

grid.appendChild(card);

});

}

if(videoIdFromUrl){

loadData();

}else{

document.getElementById('mainTitle').innerText =
"Tidak ada ID video";

}

</script>

</body>
</html>
